<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Little Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: a cutaway house (roof + 2x2 rooms) beside a tabbed drawer of pieces. One committed toy-shop look, slate and plum with a sunflower accent. */
:root{
  --paper:#dfe9f0;
  --ink:#1f2a36;
  --shell:#415d70;
  --shell-d:#2f4757;
  --roof:#5b3a63;
  --accent:#f2b632;
  --panel:#fbfdff;
  --mute:#566676;
  --line:#c0d0db;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body)}
.app{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand{min-width:0;flex:1 1 320px}
h1{font:700 clamp(30px,5vw,42px)/1 var(--display);margin:0 0 6px;letter-spacing:.2px}
.brand p{margin:0;color:var(--mute);max-width:58ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:600 13px/1 var(--display);padding:8px 12px;border-radius:99px;background:#fff;border:2px solid var(--ink);letter-spacing:.3px}
.btn{font:600 14px/1 var(--display);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){background:#fff7de}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:0 3px 0 var(--line);border-color:var(--mute)}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:9px;box-shadow:0 2px 0 var(--ink)}
.btn.sm:active:not(:disabled){transform:translateY(2px)}
.btn.warn:hover:not(:disabled){background:#ffe1dc}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:focus-visible,.tab:focus-visible,.card:focus-visible,.swatch:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.layout{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.layout{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
.left{min-width:0;display:flex;flex-direction:column;gap:14px}

/* the house */
.stage{--u:1cqw;position:relative;container-type:inline-size;aspect-ratio:100/96;width:100%;user-select:none;-webkit-user-select:none}
.stage>*{position:absolute}
.roof{left:0;top:0;width:100cqw;height:17cqw;display:block}
.shell{left:2cqw;top:16cqw;width:96cqw;height:77cqw;background:var(--shell);border-radius:.6cqw .6cqw 0 0}
.plinth{left:0;top:93cqw;width:100cqw;height:3cqw;background:var(--shell-d);border-radius:.8cqw}
.room{overflow:hidden;cursor:pointer}
.room::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.13),transparent 16%);pointer-events:none;z-index:1}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:6cqw;border-top:.5cqw solid rgba(255,255,255,.6);box-shadow:inset 0 .7cqw 0 rgba(0,0,0,.14)}
.room .tag{position:absolute;left:1cqw;top:1cqw;z-index:2;font:600 max(9px,1.6cqw)/1 var(--display);letter-spacing:.3px;padding:.7cqw 1.1cqw;border-radius:99px;background:var(--ink);color:#fff;opacity:0;transition:opacity .15s}
.room.sel .tag{opacity:1}
.room.sel{outline:.55cqw solid var(--accent);outline-offset:-.55cqw}
.items{inset:0;pointer-events:none}
.item{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;outline:none;filter:drop-shadow(0 .25cqw .2cqw rgba(0,0,0,.22))}
.item svg{display:block;width:100%;height:auto;overflow:visible;transform:scaleX(var(--fx,1))}
.item.drag{cursor:grabbing;filter:drop-shadow(0 1cqw .8cqw rgba(0,0,0,.3))}
.item.sel::after,.item:focus-visible::after{content:"";position:absolute;inset:-.7cqw;border:.3cqw dashed #fff;outline:.25cqw solid var(--ink);border-radius:1cqw;pointer-events:none;background:rgba(255,255,255,.1)}
.c1{fill:var(--c1)}
.sh{fill:#000;opacity:.13}
.hi{fill:#fff;opacity:.28}

/* selection bar */
.selbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:12px 14px}
.selinfo{min-width:0;flex:1 1 260px;color:var(--mute);font-size:14px}
.selinfo b{color:var(--ink);font:600 16px var(--display)}
.selbtns{display:flex;flex-wrap:wrap;gap:8px}

/* drawer */
.panel{min-width:0;background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
@media (min-width:920px){.panel{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}}
.panel h2{font:600 13px/1 var(--display);letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.roompick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.roombtn{font:600 14px/1 var(--display);padding:10px 8px;border-radius:9px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.roombtn[aria-pressed="true"]{border-color:var(--ink);background:var(--accent)}
.hint{margin:0;font-size:13px;color:var(--mute)}
.hint b{color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:600 13px/1 var(--display);padding:9px 11px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:grab;font:500 13px/1.2 var(--body);text-align:center;-webkit-user-select:none;user-select:none}
.card:hover{border-color:var(--ink);background:#fff7de}
.card .thumb{display:flex;align-items:center;justify-content:center;width:100%;height:62px}
.card .thumb svg{display:block}
.fin h2:not(:first-child){margin-top:14px}
.sw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.swatch{display:flex;flex-direction:column;gap:5px;padding:5px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;font:500 12px/1.2 var(--body);color:var(--ink);container-type:inline-size;text-align:center}
.swatch i{--u:1.8cqw;display:block;height:44px;border-radius:6px;border:1px solid rgba(0,0,0,.2)}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:.92;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.ghost svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Little Rooms</h1>
      <p>Decorate a four-room dollhouse. Drag pieces onto the rooms, or tap a piece to place it in the room you picked.</p>
    </div>
    <div class="actions">
      <a class="btn" href="/" style="text-decoration:none">Back to portfolio</a>
      <span class="chip">1:12 scale</span>
      <span class="chip" id="count">0 pieces</span>
      <button class="btn" id="undo" type="button">Undo</button>
      <button class="btn" id="sample" type="button">Sample layout</button>
      <button class="btn" id="clear" type="button">Empty house</button>
    </div>
  </header>

  <main class="layout">
    <section class="left">
      <div class="stage" id="stage" aria-label="Dollhouse">
        <svg class="roof" viewBox="0 0 100 17" aria-hidden="true">
          <rect x="73" y="2" width="8" height="11" fill="#7a4a5f"/>
          <rect x="72" y="1" width="10" height="2.2" rx=".5" fill="#4a2e52"/>
          <polygon points="0,17 50,1.5 100,17" fill="#5b3a63"/>
          <path d="M12 17 L50 5.6 L88 17 M24 17 L50 9.6 L76 17 M36 17 L50 13.6 L64 17" stroke="rgba(255,255,255,.2)" stroke-width=".5" fill="none"/>
          <circle cx="50" cy="11.2" r="2.7" fill="#f6e7a8" stroke="#2f4757" stroke-width=".7"/>
          <path d="M50 8.5v5.4M47.3 11.2h5.4" stroke="#2f4757" stroke-width=".4"/>
        </svg>
        <div class="shell"></div>
        <div class="plinth"></div>
        <div class="items" id="items"></div>
      </div>

      <div class="selbar">
        <div class="selinfo" id="selinfo"></div>
        <div class="selbtns">
          <button class="btn sm" id="bRecolor" type="button">Recolor</button>
          <button class="btn sm" id="bFlip" type="button">Flip</button>
          <button class="btn sm" id="bSmaller" type="button">Smaller</button>
          <button class="btn sm" id="bLarger" type="button">Larger</button>
          <button class="btn sm" id="bFront" type="button">To front</button>
          <button class="btn sm" id="bBack" type="button">To back</button>
          <button class="btn sm" id="bDup" type="button">Copy</button>
          <button class="btn sm warn" id="bDel" type="button">Remove</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div>
        <h2>Room</h2>
        <div class="roompick" id="roompick"></div>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <p class="hint" id="hint"></p>
      <div id="drawer"></div>
    </aside>
  </main>
</div>
<div class="ghost" id="ghost" hidden></div>

function pick1(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return list[0];}
function css(s){return s.replace(/(\d*\.?\d+)u\b/g,'calc(var(--u)*$1)');}

/* ---------- helpers ---------- */
function svgOf(d,box){
  var a='';
  if(box){var k=Math.min(box[0]/d.vb[0],box[1]/d.vb[1]);a=' width="'+(d.vb[0]*k).toFixed(1)+'" height="'+(d.vb[1]*k).toFixed(1)+'"';}
  return '<svg viewBox="0 0 '+d.vb[0]+' '+d.vb[1]+'"'+a+' aria-hidden="true" focusable="false">'+d.body+'</svg>';
}
function dims(it){var d=DEFS[it.d],w=d.w*it.s;return{w:w,h:w*d.vb[1]/d.vb[0]};}
function layout(it,cx,cy){
  var d=DEFS[it.d],m=dims(it),w=m.w,h=m.h,r=roomAt(cx,cy),ft=floorTop(r);
  var x=cx-w/2,minX=r.x+0.5,maxX=r.x+r.w-w-0.5;
  x=maxX<minX?r.x+(r.w-w)/2:Math.min(Math.max(x,minX),maxX);
  var y;
  if(d.kind==='floor')y=ft+FLOOR_DROP-h;
  else if(d.kind==='rug')y=ft+(FLOOR_H-h)/2+0.2;
  else if(d.kind==='ceiling')y=r.y;
  else{var minY=r.y+1.5,maxY=ft-h-0.5;y=Math.min(Math.max(cy-h/2,minY),Math.max(minY,maxY));}
  it.x=+x.toFixed(2);it.y=+y.toFixed(2);
}
function centerOf(it){var m=dims(it);return{x:it.x+m.w/2,y:it.y+m.h/2};}

/* ---------- state ---------- */
var S=null, ui={room:'liv',sel:null,tab:'Furniture'}, undo=[], KEY='littlerooms-v1';
function newState(){return{rooms:{bed:{wall:'sky',floor:'oak'},bath:{wall:'subway',floor:'bluetile'},liv:{wall:'sage',floor:'dark'},kit:{wall:'butter',floor:'checker'}},items:[],next:1};}
function putIn(st,d,cx,cy,o){
  o=o||{};
  var it={uid:st.next++,d:d,x:0,y:0,s:o.s||1,f:o.f?1:0,c:o.c||DEFS[d].c};
  layout(it,cx,cy);st.items.push(it);return it;
}
function sampleState(){
  var st=newState(),P=function(d,cx,cy,o){putIn(st,d,cx,cy,o);};
  P('rugRect',24,50,{c:'#9fd3ea'});P('rugRound',22,88);
  P('bed',17,44,{c:'#e8837c'});P('land',17,30);P('dresser',36,44);P('window',36,31);P('doll',46.5,44);P('pendant',27,22);
  P('tub',62,50);P('toilet',79,50);P('vanity',90.5,50);P('mirror',90.5,32);P('window',62,31,{c:'#fbfaf7'});
  P('sofa',15,88);P('portrait',15,70);P('lamp',28.5,88);P('tv',41,88);P('clock',41,67);P('pendant',27,60);
  P('fridge',56,88);P('counter',72,88);P('stove',88.5,88);P('window',72,71);P('bunting',72,60);P('wallshelf',88.5,68);
  return st;
}
function snap(){return JSON.stringify(S);}
function pushUndo(before){undo.push(before);if(undo.length>60)undo.shift();}
function save(){try{localStorage.setItem(KEY,snap());}catch(e){}}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var s=JSON.parse(raw);
      if(s&&s.rooms&&Array.isArray(s.items)&&s.items.every(function(i){return DEFS[i.d];})){
        ROOMS.forEach(function(r){if(!s.rooms[r.id])s.rooms[r.id]=newState().rooms[r.id];});
        return s;
      }
    }
  }catch(e){}
  return sampleState();
}
function byUid(u){for(var i=0;i<S.items.length;i++)if(S.items[i].uid===u)return S.items[i];return null;}
function mutate(fn){var before=snap();fn();pushUndo(before);render();save();}

/* ---------- DOM ---------- */
var $=function(s){return document.querySelector(s);};
var stage=$('#stage'),itemsEl=$('#items'),tabsEl=$('#tabs'),drawer=$('#drawer'),ghost=$('#ghost');
var roomEls={};
ROOMS.forEach(function(r){
  var el=document.createElement('div');
  el.className='room';el.dataset.id=r.id;
  el.style.cssText='left:'+r.x+'cqw;top:'+r.y+'cqw;width:'+r.w+'cqw;height:'+r.h+'cqw';
  el.innerHTML='<div class="floor"></div><span class="tag">'+r.name+'</span>';
  stage.insertBefore(el,$('.plinth'));
  roomEls[r.id]={el:el,floor:el.querySelector('.floor')};
});

function posEl(el,it,idx){
  var d=DEFS[it.d],w=d.w*it.s;
  el.style.left=it.x+'cqw';el.style.top=it.y+'cqw';el.style.width=w+'cqw';
  el.style.setProperty('--c1',it.c);el.style.setProperty('--fx',it.f?-1:1);
  if(idx!==undefined)el.style.zIndex=(d.kind==='rug'?0:500)+idx;
}
function itemEl(it,idx){
  var d=DEFS[it.d],el=document.createElement('div');
  el.className='item';el.dataset.uid=it.uid;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',d.name);
  el.innerHTML=svgOf(d);posEl(el,it,idx);return el;
}
function render(){
  ROOMS.forEach(function(r){
    var st=S.rooms[r.id];
    roomEls[r.id].el.style.background=css(pick1(WALLS,st.wall).css);
    roomEls[r.id].floor.style.background=css(pick1(FLOORS,st.floor).css);
  });
  itemsEl.replaceChildren.apply(itemsEl,S.items.map(function(it,i){return itemEl(it,i);}));
  if(ui.sel&&!byUid(ui.sel))ui.sel=null;
  markSel();updateUI();
}
function markSel(){
  Array.prototype.forEach.call(itemsEl.children,function(el){el.classList.toggle('sel',+el.dataset.uid===ui.sel);});
  ROOMS.forEach(function(r){roomEls[r.id].el.classList.toggle('sel',r.id===ui.room);});
}
function fmt(n){return (Math.round(n*10)/10).toFixed(1);}
function updateUI(){
  var n=S.items.length;
  $('#count').textContent=n+(n===1?' piece':' pieces');
  $('#undo').disabled=!undo.length;
  Array.prototype.forEach.call($('#roompick').children,function(b){b.setAttribute('aria-pressed',b.dataset.r===ui.room);});
  $('#hint').innerHTML='Tap a piece to place it in the <b>'+roomById(ui.room).name+'</b>, or drag it onto any room.';
  var it=ui.sel?byUid(ui.sel):null,info=$('#selinfo');
  ['bRecolor','bFlip','bSmaller','bLarger','bFront','bBack','bDup','bDel'].forEach(function(id){$('#'+id).disabled=!it;});
  if(it){
    var d=DEFS[it.d],inch=fmt(d.ft*it.s);
    info.innerHTML='<b>'+d.name+'</b><br>'+inch+' in wide in the model, '+inch+' ft in a real house.';
  }else{
    info.innerHTML='Click a piece to select it. Floor pieces stand on the floor, wall pieces slide up and down, and ceiling lights hang from the top. Arrow keys nudge, Delete removes.';
  }
  markFinishes();
}

/* room picker */
$('#roompick').innerHTML=ROOMS.map(function(r){return '<button type="button" class="roombtn" data-r="'+r.id+'" aria-pressed="false">'+r.name+'</button>';}).join('');
$('#roompick').addEventListener('click',function(e){var b=e.target.closest('.roombtn');if(b)pickRoom(b.dataset.r);});
function pickRoom(id){ui.room=id;markSel();updateUI();}
function pick(uid){
  ui.sel=uid;
  if(uid){var it=byUid(uid);if(it){var c=centerOf(it);ui.room=roomAt(c.x,c.y).id;}}
  markSel();updateUI();
}

/* drawer */
function renderDrawer(){
  tabsEl.innerHTML=TABS.map(function(t){return '<button type="button" role="tab" class="tab" data-t="'+t+'" aria-selected="'+(t===ui.tab)+'">'+t+'</button>';}).join('');
  if(ui.tab==='Finishes'){
    var sw=function(kind,list){return '<div class="sw">'+list.map(function(o){return '<button type="button" class="swatch" data-kind="'+kind+'" data-id="'+o.id+'" aria-pressed="false" title="'+o.name+'"><i style="background:'+css(o.css)+'"></i>'+o.name+'</button>';}).join('')+'</div>';};
    drawer.innerHTML='<div class="fin"><h2>Wallpaper</h2>'+sw('wall',WALLS)+'<h2>Floor</h2>'+sw('floor',FLOORS)+'</div>';
    markFinishes();return;
  }
  var keys=Object.keys(DEFS).filter(function(k){return DEFS[k].cat===ui.tab;});
  drawer.innerHTML='<div class="grid">'+keys.map(function(k){
    var d=DEFS[k];
    return '<button type="button" class="card" data-d="'+k+'" style="--c1:'+d.c+'"><span class="thumb">'+svgOf(d,[78,58])+'</span><span>'+d.name+'</span></button>';
  }).join('')+'</div>';
}
function markFinishes(){
  if(ui.tab!=='Finishes'||!S)return;
  var st=S.rooms[ui.room];
  Array.prototype.forEach.call(drawer.querySelectorAll('.swatch'),function(b){
    b.setAttribute('aria-pressed',st[b.dataset.kind]===b.dataset.id);
  });
}
tabsEl.addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;ui.tab=b.dataset.t;renderDrawer();});
drawer.addEventListener('click',function(e){
  var sw=e.target.closest('.swatch');
  if(sw){
    mutate(function(){S.rooms[ui.room][sw.dataset.kind]=sw.dataset.id;});
    return;
  }
  var card=e.target.closest('.card');
  if(!card||suppressClick)return;
  addInRoom(card.dataset.d);
});

/* ---------- adding ---------- */
var suppressClick=false;
function addAt(defId,cx,cy){
  mutate(function(){
    var it={uid:S.next++,d:defId,x:0,y:0,s:1,f:0,c:DEFS[defId].c};
    layout(it,cx,cy);S.items.push(it);
    ui.sel=it.uid;var c=centerOf(it);ui.room=roomAt(c.x,c.y).id;
  });
}
function addInRoom(defId){
  var r=roomById(ui.room),n=0;
  S.items.forEach(function(it){var c=centerOf(it);if(roomAt(c.x,c.y).id===r.id)n++;});
  addAt(defId,r.x+r.w/2+((n%5)-2)*3,r.y+14);
}

/* ---------- pointer handling ---------- */
var drag=null, dd=null;
function toCq(e){var r=stage.getBoundingClientRect(),k=100/r.width;return{x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k};}

stage.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var el=e.target.closest('.item');
  if(!el){
    var re=e.target.closest('.room');
    if(re)ui.room=re.dataset.id;
    ui.sel=null;markSel();updateUI();return;
  }
  var it=byUid(+el.dataset.uid);if(!it)return;
  pick(it.uid);
  var p=toCq(e);
  drag={it:it,el:el,id:e.pointerId,ox:p.x-it.x,oy:p.y-it.y,before:snap(),moved:false,sx:e.clientX,sy:e.clientY};
  try{el.setPointerCapture(e.pointerId);}catch(err){}
  try{el.focus({preventScroll:true});}catch(err){}
  e.preventDefault();
});

drawer.addEventListener('pointerdown',function(e){
  var card=e.target.closest('.card');
  if(!card||e.pointerType==='touch'||e.button!==0)return;
  dd={d:card.dataset.d,id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false};
});

window.addEventListener('pointermove',function(e){
  if(drag&&e.pointerId===drag.id){
    if(!drag.moved){
      if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4)return;
      drag.moved=true;drag.el.classList.add('drag');
    }
    var p=toCq(e),m=dims(drag.it);
    layout(drag.it,p.x-drag.ox+m.w/2,p.y-drag.oy+m.h/2);
    posEl(drag.el,drag.it);
  }else if(dd&&e.pointerId===dd.id){
    if(!dd.moved){
      if(Math.hypot(e.clientX-dd.sx,e.clientY-dd.sy)<6)return;
      dd.moved=true;
      var d=DEFS[dd.d],pxPer=stage.getBoundingClientRect().width/100;
      dd.w=d.w*pxPer;dd.h=dd.w*d.vb[1]/d.vb[0];
      ghost.innerHTML=svgOf(d);ghost.style.width=dd.w+'px';ghost.style.setProperty('--c1',d.c);ghost.hidden=false;
    }
    ghost.style.transform='translate('+(e.clientX-dd.w/2)+'px,'+(e.clientY-dd.h/2)+'px)';
  }
});
function endPointer(e){
  if(drag&&e.pointerId===drag.id){
    drag.el.classList.remove('drag');
    if(drag.moved){pushUndo(drag.before);save();var c=centerOf(drag.it);ui.room=roomAt(c.x,c.y).id;markSel();updateUI();}
    drag=null;
  }
  if(dd&&e.pointerId===dd.id){
    if(dd.moved){
      ghost.hidden=true;
      var r=stage.getBoundingClientRect();
      if(e.type==='pointerup'&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
        var p=toCq(e);addAt(dd.d,p.x,p.y);
      }
      suppressClick=true;setTimeout(function(){suppressClick=false;},0);
    }
    dd=null;
  }
}
window.addEventListener('pointerup',endPointer);
window.addEventListener('pointercancel',endPointer);

/* ---------- selection tools ---------- */
function sel(){return ui.sel?byUid(ui.sel):null;}
function rescale(it,k){
  var d=DEFS[it.d],ns=Math.min(1.7,Math.max(0.6,+(it.s*k).toFixed(3)));
  var c=centerOf(it),w=d.w*ns,h=w*d.vb[1]/d.vb[0],r=roomAt(c.x,c.y);
  if(d.kind!=='rug'&&h>r.h-FLOOR_H-1)return false;
  if(w>r.w-1)return false;
  it.s=ns;layout(it,c.x,c.y);return true;
}
$('#bRecolor').onclick=function(){var it=sel();if(!it)return;mutate(function(){var i=COLORS.indexOf(it.c);it.c=COLORS[(i+1)%COLORS.length];});};
$('#bFlip').onclick=function(){var it=sel();if(!it)return;mutate(function(){it.f=it.f?0:1;});};
$('#bSmaller').onclick=function(){var it=sel();if(!it)return;mutate(function(){rescale(it,1/1.15);});};
$('#bLarger').onclick=function(){var it=sel();if(!it)return;mutate(function(){rescale(it,1.15);});};
$('#bFront').onclick=function(){var it=sel();if(!it)return;mutate(function(){S.items.splice(S.items.indexOf(it),1);S.items.push(it);});};
$('#bBack').onclick=function(){var it=sel();if(!it)return;mutate(function(){S.items.splice(S.items.indexOf(it),1);S.items.unshift(it);});};
$('#bDup').onclick=function(){
  var it=sel();if(!it)return;
  mutate(function(){
    var c=centerOf(it),cp={uid:S.next++,d:it.d,x:it.x,y:it.y,s:it.s,f:it.f,c:it.c};
    layout(cp,c.x+3,c.y);S.items.push(cp);ui.sel=cp.uid;
  });
};
function removeSel(){var it=sel();if(!it)return;mutate(function(){S.items.splice(S.items.indexOf(it),1);ui.sel=null;});}
$('#bDel').onclick=removeSel;

$('#undo').onclick=doUndo;
function doUndo(){
  if(!undo.length)return;
  S=JSON.parse(undo.pop());render();save();
}
$('#sample').onclick=function(){mutate(function(){S=sampleState();ui.sel=null;});};
$('#clear').onclick=function(){mutate(function(){var st=newState();st.rooms=S.rooms;S=st;ui.sel=null;});};

document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();doUndo();return;}
  var it=sel();
  if(e.key==='Escape'){ui.sel=null;markSel();updateUI();return;}
  if(!it)return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSel();return;}
  var dx=0,dy=0;
  if(e.key==='ArrowLeft')dx=-1;else if(e.key==='ArrowRight')dx=1;else if(e.key==='ArrowUp')dy=-1;else if(e.key==='ArrowDown')dy=1;else return;
  e.preventDefault();
  var uid=it.uid;
  mutate(function(){var c=centerOf(it);layout(it,c.x+dx,c.y+dy);});
  var el=itemsEl.querySelector('[data-uid="'+uid+'"]');if(el)el.focus({preventScroll:true});
});

/* ---------- start ---------- */
S=load();
renderDrawer();
render();
})();
</script>

</body></html>
